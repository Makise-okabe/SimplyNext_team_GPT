[project]
name = "nus-career-agent"
version = "0.1.0"
description = "Agentic career opportunity discovery and verification for NUS students"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "beautifulsoup4>=4.12",
    "httpx>=0.27",
    "langchain-groq>=0.2",
    "langgraph>=0.2",
    "msal>=1.38.0",
    "pydantic>=2.8",
    "pypdf>=6.16.2",
    "python-dotenv>=1.0",
    "requests>=2.34.2",
    "streamlit>=1.45",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
pythonpath = [".", "src"]
